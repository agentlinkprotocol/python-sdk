[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlinkprotocol"
version = "0.1.0"
description = "Python SDK for the Agent Link Protocol Atlas: agent keys, signing, sealing, and the Grid local API client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Agent Link Protocol contributors" }]
dependencies = [
  "cryptography>=43",
  "blake3>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/agentlinkprotocol/python-sdk"
Documentation = "https://docs.agentlinkprotocol.org"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlinkprotocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
