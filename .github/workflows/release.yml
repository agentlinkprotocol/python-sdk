# Merge into main => tests, build, publish to PyPI through trusted publishing (no token: configure the
# project on pypi.org -> Publishing -> GitHub, repository agentlinkprotocol/python-sdk, workflow release.yml,
# environment pypi), then a GitHub release tagged vX.Y.Z from pyproject.toml.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG" && git push origin "$TAG"; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "agentlinkprotocol $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
          git tag -f latest && git push -f origin latest
