name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
  tests:
    # Single required check for branch protection; green only when every Python version passed.
    name: tests
    needs: python
    runs-on: ubuntu-latest
    steps:
      - run: echo "all Python versions passed"
